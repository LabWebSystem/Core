[tools]
go = "1.26.3"
node = "22.22.0"
python = "3.13.15"
uv = "0.12.5"

[task_config]
includes = ["scripts/mise.lib.toml"]

[tasks.verify]
description = "品質ゲートを実行（fast、qa、release）"
run = "scripts/verify.sh ${usage_profile:-fast}"
usage = '''
arg "[profile]" help="検証プロファイル（fast、qa、release）"
'''

[tasks.build]
description = "lwsctlバイナリとリリースパッケージを生成"
run = "scripts/package.sh"

[tasks.package]
description = ".debと.rpmの成果物を生成"
run = "scripts/package.sh"

[tasks.version]
description = "CoreまたはSDKのバージョンを設定または表示"
run = "scripts/version.sh $usage_component ${usage_version:-}"
usage = '''
arg "[component]" help="対象コンポーネント（coreまたはsdk）"
arg "[version]" help="設定するバージョン"
'''

[tasks.release]
description = "指定したCoreまたはSDKを公開"
run = "scripts/release.sh $usage_component ${usage_force:+--force}"
usage = '''
arg "<component>..." help="公開するコンポーネント（core、sdk、all）"
flag "-f --force" help="既存Coreリリースを確認なしで置き換える"
'''

[tasks.dev]
description = "モックCompose環境を起動"
run = "docker compose -f infrastructure/compose.yaml up"
