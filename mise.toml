[tools]
go = "1.26.3"

[tasks.lint]
description = "静的検査を実行"
run = "scripts/lint.sh"

[tasks.test]
description = "軽量な統合テストを実行"
run = "scripts/test.sh"

[tasks.build]
description = "lwsctlバイナリとリリースパッケージを生成"
run = "scripts/package.sh --version ${LWS_VERSION:-0.1.0}"

[tasks.package]
description = ".debと.rpmの成果物を生成"
run = "scripts/package.sh --version ${LWS_VERSION:-0.1.0}"

[tasks.deploy]
description = "GitHubのLWSリリースを作成または上書き"
run = "scripts/deploy.sh"

[tasks.dev]
description = "モックCompose環境を起動"
run = "docker compose -f infrastructure/compose.yaml up"
