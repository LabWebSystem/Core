[tools]
go = "1.26.3"
node = "22.22.0"
python = "3.13.15"
uv = "0.12.5"

[task_config]
includes = ["scripts/mise.lib.toml"]

[tasks.verify]
description = "品質ゲートを実行（fast、qa、release）"
run = "scripts/verify.sh ${usage_profile:-fast}"
usage = '''
arg "[profile]" help="検証プロファイル（fast、qa、release）"
'''

[tasks.build]
description = "lwsctlバイナリとリリースパッケージを生成"
run = "scripts/package.sh"

[tasks.package]
description = ".debと.rpmの成果物を生成"
run = "scripts/package.sh"

[tasks.version]
description = "CoreまたはSDKのバージョンを設定または表示"
run = "scripts/version.sh $usage_component ${usage_version:-}"
usage = '''
arg "[component]" help="対象コンポーネント（coreまたはsdk）"
arg "[version]" help="設定するバージョン"
'''

[tasks.release]
description = "指定したCoreまたはSDKを公開"
run = "scripts/release.sh $usage_component ${usage_force:+--force}"
usage = '''
arg "<component>..." help="公開するコンポーネント（core、sdk、all）"
flag "-f --force" help="既存Coreリリースを確認なしで置き換える"
'''

[tasks.dev]
description = "モックCompose環境を起動"
run = "docker compose -f infrastructure/compose.yaml up"

[tasks.dev-dashboard]
description = "DashboardとBackendを隔離されたローカル開発環境で起動"
run = "LWS_HTTP_PORT=18180 LWS_DNS_PORT=1053 LWS_INSTALLATION_ID=dashboard-dev docker compose --project-name lws-dashboard-dev --file infrastructure/compose.yaml --file infrastructure/compose.dashboard-dev.yaml up --build --remove-orphans"

[tasks.dev-dashboard-down]
description = "隔離されたDashboard開発環境を停止・削除"
run = "LWS_HTTP_PORT=18180 LWS_DNS_PORT=1053 LWS_INSTALLATION_ID=dashboard-dev docker compose --project-name lws-dashboard-dev --file infrastructure/compose.yaml --file infrastructure/compose.dashboard-dev.yaml down --remove-orphans"

[tasks.dev-dashboard-reset]
description = "Dashboard開発環境とテストデータを完全に削除"
run = "LWS_HTTP_PORT=18180 LWS_DNS_PORT=1053 LWS_INSTALLATION_ID=dashboard-dev docker compose --project-name lws-dashboard-dev --file infrastructure/compose.yaml --file infrastructure/compose.dashboard-dev.yaml down --volumes --remove-orphans"
