[tools]
go = "1.26.3"
python = "3.13.15"
uv = "0.12.5"

[tasks.lint]
description = "静的検査を実行"
run = "scripts/lint.sh"

[tasks.test]
description = "軽量な統合テストを実行"
run = "scripts/test.sh ${usage_target:-}"
usage = '''
arg "[target]" help="テスト対象（fixtures、cli、installer、release、backend、backend-http、backend-docker、infrastructure）"
'''

[tasks.qa]
description = "Robot Frameworkの受け入れテストを実行"
run = "uv run --project qa robot --nostatusrc --outputdir test/result/robot qa/suites"

[tasks.qa-current]
description = "現在実装済みのRobot Framework受け入れテストを実行"
run = "uv run --project qa robot --outputdir test/result/robot-current --exclude planned qa/suites"

[tasks.qa-live]
description = "起動済みLWSに対するAPI受け入れテストを実行"
run = "uv run --project qa robot --outputdir test/result/robot-live --include live qa/suites"

[tasks.qa-lifecycle]
description = "隔離したCompose環境でLWSの起動ライフサイクルを実行"
run = "uv run --project qa robot --outputdir test/result/robot-lifecycle qa/suites/v1/lifecycle.robot"

[tasks.qa-docs]
description = "Robot Frameworkの機能テスト項目を生成"
run = [
  "mkdir -p docs/generated",
  "uv run --project qa testdoc -f html qa/suites docs/generated/機能テスト項目v1.html",
  "uv run --project qa testdoc -f json qa/suites docs/generated/機能テスト項目v1.json",
]

[tasks.build]
description = "lwsctlバイナリとリリースパッケージを生成"
run = "scripts/package.sh"

[tasks.package]
description = ".debと.rpmの成果物を生成"
run = "scripts/package.sh"

[tasks.version]
description = "CoreまたはSDKのバージョンを設定または表示"
run = "scripts/version.sh $usage_component ${usage_version:-}"
usage = '''
arg "[component]" help="対象コンポーネント（coreまたはsdk）"
arg "[version]" help="設定するバージョン"
'''

[tasks.release]
description = "指定したCoreまたはSDKを公開"
run = "scripts/release.sh $usage_component ${usage_force:+--force}"
usage = '''
arg "<component>..." help="公開するコンポーネント（core、sdk、all）"
flag "-f --force" help="既存Coreリリースを確認なしで置き換える"
'''

[tasks.dev]
description = "モックCompose環境を起動"
run = "docker compose -f infrastructure/compose.yaml up"

[tasks.generate-backend]
description = "BackendのOpenAPI生成物を更新"
run = "scripts/generate-backend.sh"

[tasks.check-openapi]
description = "OpenAPI生成物の差分を検査"
run = "scripts/generate-backend.sh && git diff --exit-code -- backend/openapi.gen.go"
