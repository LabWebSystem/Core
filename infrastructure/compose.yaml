name: lws
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ghcr.io/${LWS_GITHUB_OWNER:-labwebsystem}/lws-backend:${LWS_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      LWS_BASE_DOMAIN: ${LWS_BASE_DOMAIN:-}
      LWS_DATABASE_PATH: /var/lib/lws/database.sqlite
      LWS_CADDY_CONTAINER: ${LWS_CADDY_CONTAINER:-lws-caddy-1}
      LWS_COREDNS_CONTAINER: ${LWS_COREDNS_CONTAINER:-lws-coredns-1}
    volumes:
      - lws-backend-data:/var/lib/lws
      - lws-generated:/var/lib/lws/generated
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [lws-internal]
    labels:
      com.labwebsystem.owner: lws
  dashboard:
    image: ghcr.io/${LWS_GITHUB_OWNER:-labwebsystem}/lws-dashboard:${LWS_VERSION:-0.1.0}
    restart: unless-stopped
    depends_on: [backend]
    labels:
      com.labwebsystem.owner: lws
    networks: [lws-internal]

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
    volumes:
      - lws-generated:/etc/caddy:ro
    networks: [lws-internal]
    labels:
      com.labwebsystem.owner: lws

  coredns:
    image: coredns/coredns:1.12.4
    command: -conf /etc/coredns/Corefile
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./Corefile:/etc/coredns/Corefile:ro
      - lws-generated:/var/lib/lws/generated
    networks: [lws-internal]
    labels:
      com.labwebsystem.owner: lws

volumes:
  lws-backend-data:
    labels:
      com.labwebsystem.owner: lws
  lws-generated:
    labels:
      com.labwebsystem.owner: lws

networks:
  lws-internal:
    name: lws-internal
    labels:
      com.labwebsystem.owner: lws
