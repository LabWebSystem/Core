name: lws
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ghcr.io/${LWS_GITHUB_OWNER:-labwebsystem}/lws-backend:${LWS_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      LWS_BASE_DOMAIN: ${LWS_BASE_DOMAIN:-}
      LWS_VERSION: ${LWS_VERSION:-0.1.0}
      LWS_INSTALLATION_ID: ${LWS_INSTALLATION_ID:-}
      LWS_PUBLIC_ADDRESS: ${LWS_PUBLIC_ADDRESS:-}
      LWS_DATABASE_PATH: /var/lib/lws/database.sqlite
      LWS_SECRET_KEY_PATH: /etc/lws/secret.key
      LWS_CADDY_CONTAINER: ${LWS_CADDY_CONTAINER:-lws-caddy-1}
      LWS_AVAHI_CONTAINER: ${LWS_AVAHI_CONTAINER:-lws-avahi-1}
      LWS_DASHBOARD_IMAGE: ghcr.io/${LWS_GITHUB_OWNER:-labwebsystem}/lws-dashboard:${LWS_VERSION:-0.1.0}
    volumes:
      # DB、アプリsource、生成設定をNamed Volumeに保持する。登録アプリの
      # Composeではhost bind mountを許可しないため、アプリ領域の共有は不要である。
      - lws-backend-data:/var/lib/lws
      - lws-backend-config:/etc/lws
      - lws-generated:/var/lib/lws/generated
      - /var/run/docker.sock:/var/run/docker.sock
      # Backendはデバイスを割り当てず検出だけを行う。ホストのdevice nodeと
      # udev databaseは読み取り専用で渡し、実際の割り当ては登録アプリへ行う。
      - /dev:/dev:ro
      - /run/udev:/run/udev:ro
    networks: [lws-internal]
    labels:
      com.labwebsystem.owner: lws
      com.labwebsystem.installation-id: ${LWS_INSTALLATION_ID:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header=Host:api.$${LWS_BASE_DOMAIN} http://127.0.0.1:8080/api/v1/health/live -O - >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
  caddy:
    image: caddy:2.10-alpine
    command: ["sh", "-c", "while [ ! -f /var/lib/lws/generated/Caddyfile ]; do sleep 1; done; exec caddy run --config /var/lib/lws/generated/Caddyfile --adapter caddyfile"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${LWS_HTTP_PORT:-80}:80"
    volumes:
      - lws-generated:/var/lib/lws/generated:ro
    networks: [lws-internal]
    labels:
      com.labwebsystem.owner: lws
      com.labwebsystem.installation-id: ${LWS_INSTALLATION_ID:-}

  avahi:
    image: ghcr.io/${LWS_GITHUB_OWNER:-labwebsystem}/lws-avahi:${LWS_VERSION:-0.1.0}
    network_mode: host
    restart: unless-stopped
    environment:
      LWS_PUBLIC_ADDRESS: ${LWS_PUBLIC_ADDRESS:-}
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - lws-generated:/var/lib/lws/generated:ro
    labels:
      com.labwebsystem.owner: lws
      com.labwebsystem.installation-id: ${LWS_INSTALLATION_ID:-}

volumes:
  lws-backend-data:
    labels:
      com.labwebsystem.owner: lws
      com.labwebsystem.installation-id: ${LWS_INSTALLATION_ID:-}
  lws-backend-config:
    labels:
      com.labwebsystem.owner: lws
      com.labwebsystem.installation-id: ${LWS_INSTALLATION_ID:-}
  lws-generated:
    labels:
      com.labwebsystem.owner: lws
      com.labwebsystem.installation-id: ${LWS_INSTALLATION_ID:-}

networks:
  lws-internal:
    name: lws-internal
    labels:
      com.labwebsystem.owner: lws
      com.labwebsystem.installation-id: ${LWS_INSTALLATION_ID:-}
