services:
  backend:
    image: lws-dashboard-dev-backend:local
    environment:
      LWS_BASE_DOMAIN: lws.localhost
      LWS_INSTALLATION_ID: dashboard-dev
      LWS_PUBLIC_ADDRESS: 127.0.0.1
      LWS_CADDY_CONTAINER: lws-dashboard-dev-caddy-1
      LWS_COREDNS_CONTAINER: lws-dashboard-dev-coredns-1
      LWS_ALLOWED_ORIGIN: http://dashboard.lws.localhost:18180

  dashboard:
    image: lws-dashboard-dev-dashboard:local

volumes:
  lws-backend-data:
    name: lws-dashboard-dev-backend-data
  lws-backend-config:
    name: lws-dashboard-dev-backend-config
  lws-generated:
    name: lws-dashboard-dev-generated

networks:
  lws-internal:
    name: lws-dashboard-dev-internal
