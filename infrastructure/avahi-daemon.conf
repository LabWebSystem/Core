[server]
host-name=lws
use-ipv4=yes
use-ipv6=yes
enable-dbus=no
check-response-ttl=no
use-iff-running=no
disallow-other-stacks=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[publish]
publish-addresses=no
publish-hinfo=no
publish-workstation=no
publish-domain=no
publish-dns-servers=no

[reflector]
enable-reflector=no

[rlimits]
rlimit-core=0
rlimit-data=2097152
rlimit-fsize=0
rlimit-nofile=32
rlimit-stack=2097152
rlimit-nproc=3
