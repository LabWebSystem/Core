#:schema https://mise.jdx.dev/schema/mise-task.json

[format]
description = "GoとDashboardのコードを整形"
run = "scripts/format.sh write"

[format-check]
description = "GoとDashboardのフォーマットを検査"
run = "scripts/format.sh check"

[dashboard-install]
description = "Dashboardの依存関係をインストール"
run = "npm --prefix dashboard ci --no-audit --no-fund"

[lint]
description = "静的検査を実行"
depends = ["dashboard-install"]
run = ["scripts/lint.sh", "npm --prefix dashboard run lint"]

[test]
description = "軽量な統合テストを実行"
run = "scripts/test.sh ${usage_target:-}"
usage = '''
arg "[target]" help="テスト対象（fast、fixtures、cli、installer、release、backend、backend-http、backend-docker、infrastructure、architecture）"
'''

[test-sdk]
description = "SDKのtestとbuildを実行"
dir = "sdk"
run = ["npm test", "npm run build"]

[test-dashboard]
description = "Dashboardのlint、test、build、イメージを検証"
depends = ["dashboard-install"]
run = ["npm --prefix dashboard run lint", "npm --prefix dashboard test", "npm --prefix dashboard run build", "scripts/run-with-image-cleanup.sh docker build --file dashboard/Dockerfile dashboard"]

[qa]
description = "Robot Frameworkの受け入れテストを実行"
run = "scripts/run-with-image-cleanup.sh uv run --project qa robot --nostatusrc --exclude live --outputdir test/result/robot qa/suites"

[qa-current]
description = "現在実装済みのRobot Framework受け入れテストを実行"
run = "scripts/run-with-image-cleanup.sh uv run --project qa robot --outputdir test/result/robot-current --exclude planned --exclude isolated qa/suites"

[qa-live]
description = "起動済みLWSに対するAPI受け入れテストを実行"
run = "uv run --project qa robot --outputdir test/result/robot-live --include live qa/suites"

[qa-lifecycle]
description = "隔離したCompose環境でLWSの起動ライフサイクルを実行"
run = "scripts/run-with-image-cleanup.sh uv run --project qa robot --outputdir test/result/robot-lifecycle qa/suites/v1/lifecycle.robot"

[qa-docs]
description = "Robot Frameworkの機能テスト項目を生成"
run = [
  "mkdir -p docs/generated",
  "uv run --project qa testdoc -f html qa/suites docs/generated/機能テスト項目v1.html",
  "uv run --project qa testdoc -f json qa/suites docs/generated/機能テスト項目v1.json",
]

[generate-backend]
description = "BackendのOpenAPI生成物を更新"
run = "scripts/generate-backend.sh"

[check-openapi]
description = "OpenAPI生成物の差分を検査"
run = "scripts/generate-backend.sh && git diff --exit-code -- backend/openapi.gen.go"
