name: SDKリリース
on:
  push:
    tags: ['sdk-v*']
permissions:
  packages: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: SDKバージョンをリリースタグと照合
        run: test "$(node -p "require('./sdk/package.json').version")" = "${GITHUB_REF_NAME#sdk-v}"
      - run: mise run test-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: lws-sdk-dist
          path: sdk/dist
          if-no-files-found: error
  publish:
    needs: [quality]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - uses: actions/download-artifact@v4
        with:
          name: lws-sdk-dist
          path: sdk/dist
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
