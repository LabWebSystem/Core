name: SDKリリース
on:
  push:
    tags: ['sdk-v*']
permissions:
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - name: SDKバージョンをリリースタグと照合
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#sdk-v}"
      - run: npm test
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
