name: SDKリリース
on:
  push:
    tags: ['sdk-v*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - name: SDKバージョンをリリースタグと照合
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#sdk-v}"
      - name: 公開用成果物を生成
        run: npm run build
      - name: SDKを公開
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
