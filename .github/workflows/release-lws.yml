name: LWSリリース
on:
  push:
    tags: ['lws-v*']
permissions:
  contents: write
  packages: write
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: Coreバージョンをリリースタグと照合
        run: test "$(scripts/version.sh core)" = "${GITHUB_REF_NAME#lws-v}"
  quality:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: mise run verify release
      - name: 品質ゲート結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-test-results
          path: test/result/
          if-no-files-found: ignore
  backend-image:
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Backendイメージ名を作成
        id: image
        run: echo "image=ghcr.io/labwebsystem/lws-backend:${GITHUB_REF_NAME#lws-v}" >> "$GITHUB_OUTPUT"
      - name: Backendイメージをキャッシュ付きでビルドして公開
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha,scope=lws-backend
          cache-to: type=gha,mode=max,scope=lws-backend
  dashboard-image:
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Dashboardイメージ名を作成
        id: image
        run: echo "image=ghcr.io/labwebsystem/lws-dashboard:${GITHUB_REF_NAME#lws-v}" >> "$GITHUB_OUTPUT"
      - name: Dashboardイメージをキャッシュ付きでビルドして公開
        uses: docker/build-push-action@v7
        with:
          context: dashboard
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha,scope=lws-dashboard
          cache-to: type=gha,mode=max,scope=lws-dashboard
  avahi-image:
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Avahiイメージ名を作成
        id: image
        run: echo "image=ghcr.io/labwebsystem/lws-avahi:${GITHUB_REF_NAME#lws-v}" >> "$GITHUB_OUTPUT"
      - name: Avahiイメージをビルドして公開
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/Dockerfile.avahi
          network: host
          allow: network.host
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha,scope=lws-avahi
          cache-to: type=gha,mode=max,scope=lws-avahi
  package:
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: バージョンtagを使ってパッケージ化
        run: mise run package
      - uses: actions/upload-artifact@v7
        with:
          name: lws-release-assets
          path: dist/*
          if-no-files-found: error
  release:
    needs: [quality, package, backend-image, dashboard-image, avahi-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lws-release-assets
          path: dist
      - name: GitHubリリースを公開
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "LWS ${GITHUB_REF_NAME#lws-v}" --generate-notes
