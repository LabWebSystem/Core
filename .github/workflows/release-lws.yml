name: LWSリリース
on:
  push:
    tags: ['lws-v*']
permissions:
  contents: write
  packages: write
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: Coreバージョンをリリースタグと照合
        run: test "$(scripts/version.sh core)" = "${GITHUB_REF_NAME#lws-v}"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: mise run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: mise run test
  backend-image:
    needs: [version, lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backendイメージをビルドして公開
        id: publish
        run: |
          VERSION="${GITHUB_REF_NAME#lws-v}"
          IMAGE="ghcr.io/labwebsystem/lws-backend:${VERSION}"
          docker build --tag "$IMAGE" backend
          docker push "$IMAGE"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)"
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
  dashboard-image:
    needs: [version, lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Dashboardイメージをビルドして公開
        id: publish
        run: |
          VERSION="${GITHUB_REF_NAME#lws-v}"
          IMAGE="ghcr.io/labwebsystem/lws-dashboard:${VERSION}"
          docker build --tag "$IMAGE" dashboard
          docker push "$IMAGE"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)"
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
    outputs:
      digest: ${{ steps.publish.outputs.digest }}

  package:
    needs: [version, lint, test, backend-image, dashboard-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: リリースdigestを注入してパッケージ化
        env:
          LWS_BACKEND_DIGEST: ${{ needs.backend-image.outputs.digest }}
          LWS_DASHBOARD_DIGEST: ${{ needs.dashboard-image.outputs.digest }}
        run: mise run package
      - uses: actions/upload-artifact@v4
        with:
          name: lws-release-assets
          path: dist/*
          if-no-files-found: error
  release:
    needs: [version, lint, test, package, backend-image, dashboard-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lws-release-assets
          path: dist
      - name: GitHubリリースを公開
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "LWS ${GITHUB_REF_NAME#lws-v}" --generate-notes
