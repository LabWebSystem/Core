name: LWSリリース
on:
  push:
    tags: ['lws-v*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: Coreバージョンをリリースタグと照合
        run: test "$(scripts/version.sh core)" = "${GITHUB_REF_NAME#lws-v}"
  backend-image:
    needs: [version]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Backendイメージ名を作成
        id: image
        run: echo "image=ghcr.io/labwebsystem/lws-backend:${GITHUB_REF_NAME#lws-v}" >> "$GITHUB_OUTPUT"
      - name: Backendイメージをビルドして公開
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha,scope=lws-backend
          cache-to: type=gha,mode=max,scope=lws-backend
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
  dashboard-image:
    needs: [version]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Dashboardイメージ名を作成
        id: image
        run: echo "image=ghcr.io/labwebsystem/lws-dashboard:${GITHUB_REF_NAME#lws-v}" >> "$GITHUB_OUTPUT"
      - name: Dashboardイメージをビルドして公開
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: dashboard
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha,scope=lws-dashboard
          cache-to: type=gha,mode=max,scope=lws-dashboard
    outputs:
      digest: ${{ steps.publish.outputs.digest }}

  avahi-image:
    needs: [version]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Avahiイメージ名を作成
        id: image
        run: echo "image=ghcr.io/labwebsystem/lws-avahi:${GITHUB_REF_NAME#lws-v}" >> "$GITHUB_OUTPUT"
      - name: Avahiイメージをビルドして公開
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/Dockerfile.avahi
          network: host
          allow: network.host
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha,scope=lws-avahi
          cache-to: type=gha,mode=max,scope=lws-avahi
    outputs:
      digest: ${{ steps.publish.outputs.digest }}

  package:
    needs: [version, backend-image, dashboard-image, avahi-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: リリースdigestを注入してパッケージ化
        env:
          LWS_BACKEND_DIGEST: ${{ needs.backend-image.outputs.digest }}
          LWS_DASHBOARD_DIGEST: ${{ needs.dashboard-image.outputs.digest }}
          LWS_AVAHI_DIGEST: ${{ needs.avahi-image.outputs.digest }}
          LWS_RELEASE_MODE: '1'
        run: mise run package
      - uses: actions/upload-artifact@v7
        with:
          name: lws-release-assets
          path: dist/*
          if-no-files-found: error
  release:
    needs: [version, package, backend-image, dashboard-image, avahi-image]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lws-release-assets
          path: dist
      - name: GitHubリリースを公開
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "LWS ${GITHUB_REF_NAME#lws-v}" --generate-notes
