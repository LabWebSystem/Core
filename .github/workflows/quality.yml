name: LWS品質検証
run-name: 品質検証 ${{ inputs.profile }} / ${{ github.ref_name }} / ${{ inputs.request_id }}
on:
  workflow_call:
    inputs:
      profile:
        description: 検証範囲
        required: true
        type: string
      request_id:
        description: ローカル起動との照合ID
        required: false
        type: string
  workflow_dispatch:
    inputs:
      profile:
        description: 検証範囲
        required: true
        type: choice
        options:
          - fast
          - full
        default: full
      request_id:
        description: ローカル起動との照合ID
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  static:
    name: 静的検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
      - run: mise run lint
      - name: 検証結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-static
          path: test/result/
          if-no-files-found: ignore

  core-fast:
    name: Core高速テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
      - run: mise run test fast
      - name: 検証結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-core-fast
          path: test/result/
          if-no-files-found: ignore

  sdk:
    name: SDKテストとbuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: mise run test-sdk
      - name: 検証結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-sdk
          path: test/result/
          if-no-files-found: ignore

  dashboard:
    name: Dashboard検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: mise run test-dashboard
      - name: 検証結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-dashboard
          path: test/result/
          if-no-files-found: ignore

  core-integration:
    name: Core統合テスト
    if: ${{ inputs.profile == 'full' }}
    needs: [static, core-fast, sdk, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - run: mise run test full
      - name: 検証結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-core-integration
          path: test/result/
          if-no-files-found: ignore

  qa-current:
    name: 自己完結Robot QA
    if: ${{ inputs.profile == 'full' }}
    needs: [static, core-fast, sdk, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: mise run qa-current
      - name: Robot結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-qa-current
          path: test/result/robot-current/
          if-no-files-found: ignore

  qa-lifecycle:
    name: 隔離ライフサイクルRobot QA
    if: ${{ inputs.profile == 'full' }}
    needs: [static, core-fast, sdk, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - run: mise run qa-lifecycle
      - name: Robot結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-qa-lifecycle
          path: test/result/robot-lifecycle/
          if-no-files-found: ignore

  qa-docs:
    name: QAテスト項目ドキュメント生成
    if: ${{ inputs.profile == 'full' }}
    needs: [static, core-fast, sdk, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: mise run qa-docs
      - name: 生成docsを保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-qa-docs
          path: docs/generated/
          if-no-files-found: ignore

  import-e2e:
    name: ZIP取り込みブラウザ結合テスト
    if: ${{ inputs.profile == 'full' }}
    needs: [static, core-fast, sdk, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
      - uses: actions/cache@v4
        name: Playwright browser cacheを復元
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}
      - run: mise run test-import-e2e
      - name: 検証結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-import-e2e
          path: test/result/
          if-no-files-found: ignore

  summary:
    name: 品質ゲート集約
    if: always()
    needs:
      - static
      - core-fast
      - sdk
      - dashboard
      - core-integration
      - qa-current
      - qa-lifecycle
      - qa-docs
      - import-e2e
    runs-on: ubuntu-latest
    steps:
      - name: 結果をWorkflow summaryへ集約
        env:
          PROFILE: ${{ inputs.profile }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          SUMMARY_FILE: ${{ runner.temp }}/quality-summary.md
        run: |
          JOB_TIMINGS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | [.name, .started_at // "", .completed_at // ""] | @tsv' || true)"
          JOB_TIMINGS="$JOB_TIMINGS" python3 - <<'PY'
          from datetime import datetime
          import json
          import os
          import sys

          profile = os.environ["PROFILE"]
          jobs = json.loads(os.environ["JOB_RESULTS"])
          full_jobs = {"core-integration", "qa-current", "qa-lifecycle", "qa-docs", "import-e2e"}
          display_names = {
              "static": "静的検査",
              "core-fast": "Core高速テスト",
              "sdk": "SDKテストとbuild",
              "dashboard": "Dashboard検証",
              "core-integration": "Core統合テスト",
              "qa-current": "自己完結Robot QA",
              "qa-lifecycle": "隔離ライフサイクルRobot QA",
              "qa-docs": "QAテスト項目ドキュメント生成",
              "import-e2e": "ZIP取り込みブラウザ結合テスト",
              "summary": "品質ゲート集約",
          }
          timing_by_name = {}
          quality_starts = []
          quality_ends = []
          for line in os.environ["JOB_TIMINGS"].splitlines():
              name, started, completed = line.split("\t")
              label = name.removeprefix("quality / ")
              if label not in display_names.values() or not started or not completed:
                  continue
              start = datetime.fromisoformat(started.replace("Z", "+00:00"))
              end = datetime.fromisoformat(completed.replace("Z", "+00:00"))
              seconds = max(0, round((end - start).total_seconds()))
              timing_by_name[label] = f"{seconds // 60}m {seconds % 60:02d}s"
              quality_starts.append(start)
              quality_ends.append(end)

          lines = [f"## LWS品質検証: {profile}", ""]
          if quality_starts and quality_ends:
              elapsed = max(0, round((max(quality_ends) - min(quality_starts)).total_seconds()))
              lines.extend([f"品質ゲート実時間（Actions上）: **{elapsed // 60}m {elapsed % 60:02d}s**", ""])
          lines.extend(["| ジョブ | 結果 | Actions実時間 |", "|---|---|---:|"])
          failed = False
          for name, result in jobs.items():
              state = result["result"]
              expected_skip = profile == "fast" and name in full_jobs
              shown = "SKIP（fast profile）" if expected_skip and state == "skipped" else state.upper()
              label = display_names.get(name, name)
              duration = timing_by_name.get(label, "—")
              lines.append(f"| `{label}` | {shown} | {duration} |")
              if expected_skip:
                  continue
              if state != "success":
                  failed = True
          report = "\n".join(lines) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(report)
          with open(os.environ["SUMMARY_FILE"], "w", encoding="utf-8") as summary:
              summary.write(report)
          if profile not in {"fast", "full"}:
              print(f"未対応の検証範囲です: {profile}", file=sys.stderr)
              sys.exit(2)
          if failed:
              sys.exit(1)
          PY
      - name: 集約結果artifactを保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-summary
          path: ${{ runner.temp }}/quality-summary.md
          if-no-files-found: ignore
