name: Release LWS
on:
  push:
    tags: ['lws-v*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run lint
      - run: mise run test
      - run: mise run package
        env:
          LWS_VERSION: ${{ github.ref_name 거 }}
      - name: Build and publish mock images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lws-backend:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: dashboard
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lws-dashboard:${{ github.ref_name }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "LWS ${GITHUB_REF_NAME#lws-v}" --generate-notes
